<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Purple gradient background -->
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9333EA;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:1" />
    </linearGradient>

    <!-- Window shadow gradient -->
    <linearGradient id="windowShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0" />
    </linearGradient>

    <!-- 3D depth gradient for window -->
    <linearGradient id="depthGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.1" />
    </linearGradient>

    <!-- W letter gradient for 3D effect -->
    <linearGradient id="wGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0E0E0;stop-opacity:1" />
    </linearGradient>

    <!-- Drop shadow filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <!-- Inner glow filter -->
    <filter id="innerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- 3D emboss effect for window -->
    <filter id="emboss">
      <feOffset dx="0" dy="2" result="offset"/>
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="offset"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle with gradient -->
  <circle cx="512" cy="512" r="480" fill="url(#purpleGradient)" filter="url(#dropShadow)"/>

  <!-- Terminal window base -->
  <g transform="translate(180, 200)">
    <!-- Window shadow -->
    <rect x="16" y="16" width="632" height="568" rx="24" ry="24"
          fill="#000000" opacity="0.2"/>

    <!-- Main window frame -->
    <rect x="0" y="0" width="664" height="568" rx="24" ry="24"
          fill="#1F1F1F" stroke="#2D2D2D" stroke-width="2"/>

    <!-- Title bar -->
    <rect x="0" y="0" width="664" height="56" rx="24" ry="24" fill="#2D2D2D"/>
    <rect x="0" y="28" width="664" height="28" fill="#2D2D2D"/>

    <!-- Window control buttons (macOS style) -->
    <!-- Close button -->
    <circle cx="32" cy="28" r="10" fill="#FF5F56"/>
    <circle cx="32" cy="28" r="10" fill="#FF5F56" stroke="#E0443E" stroke-width="1"/>

    <!-- Minimize button -->
    <circle cx="60" cy="28" r="10" fill="#FFBD2E"/>
    <circle cx="60" cy="28" r="10" fill="#FFBD2E" stroke="#DEA123" stroke-width="1"/>

    <!-- Maximize button -->
    <circle cx="88" cy="28" r="10" fill="#27C93F"/>
    <circle cx="88" cy="28" r="10" fill="#27C93F" stroke="#1AAB29" stroke-width="1"/>

    <!-- Terminal content area with gradient -->
    <rect x="12" y="68" width="640" height="488" rx="8" ry="8"
          fill="url(#depthGradient)" opacity="0.5"/>

    <!-- Decorative terminal lines -->
    <rect x="32" y="100" width="200" height="8" rx="4" fill="#FFFFFF" opacity="0.15"/>
    <rect x="32" y="128" width="400" height="8" rx="4" fill="#FFFFFF" opacity="0.1"/>
    <rect x="32" y="156" width="300" height="8" rx="4" fill="#FFFFFF" opacity="0.08"/>

    <!-- The "W" letter - Large, centered, 3D effect -->
    <g transform="translate(332, 324)">
      <!-- W shadow -->
      <text x="4" y="4"
            font-family="SF Pro Display, -apple-system, Arial, sans-serif"
            font-size="280"
            font-weight="bold"
            fill="#000000"
            opacity="0.3"
            text-anchor="middle"
            dominant-baseline="middle">W</text>

      <!-- W main letter with gradient -->
      <text x="0" y="0"
            font-family="SF Pro Display, -apple-system, Arial, sans-serif"
            font-size="280"
            font-weight="bold"
            fill="url(#wGradient)"
            text-anchor="middle"
            dominant-baseline="middle"
            filter="url(#innerGlow)">W</text>

      <!-- W highlight (top edge) -->
      <text x="0" y="-2"
            font-family="SF Pro Display, -apple-system, Arial, sans-serif"
            font-size="280"
            font-weight="bold"
            fill="#FFFFFF"
            opacity="0.3"
            text-anchor="middle"
            dominant-baseline="middle">W</text>
    </g>

    <!-- Command prompt decoration -->
    <g transform="translate(32, 450)" opacity="0.6">
      <text x="0" y="0"
            font-family="SF Mono, Monaco, monospace"
            font-size="32"
            fill="#A78BFA">$</text>
      <rect x="48" y="-24" width="180" height="6" rx="3" fill="#A78BFA" opacity="0.5"/>
    </g>

    <!-- Cursor blink effect -->
    <rect x="32" y="485" width="24" height="32" rx="4" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- Glossy overlay for 3D effect -->
  <ellipse cx="512" cy="200" rx="350" ry="150" fill="#FFFFFF" opacity="0.05"/>

  <!-- Subtle rim light -->
  <circle cx="512" cy="512" r="475" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.1"/>
</svg>
