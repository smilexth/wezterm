<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Purple gradient background -->
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A855F7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:1" />
    </linearGradient>

    <!-- White gradient for W -->
    <linearGradient id="whiteGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F3F4F6;stop-opacity:1" />
    </linearGradient>

    <!-- Shadow -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="20" stdDeviation="40" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="64" y="64" width="896" height="896" rx="180" ry="180"
        fill="url(#purpleGradient)" filter="url(#shadow)"/>

  <!-- Terminal window outline -->
  <rect x="200" y="220" width="624" height="520" rx="40" ry="40"
        fill="none" stroke="#FFFFFF" stroke-width="8" opacity="0.2"/>

  <!-- Title bar -->
  <rect x="200" y="220" width="624" height="60" rx="40" ry="40"
        fill="#FFFFFF" opacity="0.1"/>
  <rect x="200" y="240" width="624" height="40" fill="#FFFFFF" opacity="0.1"/>

  <!-- Window buttons -->
  <circle cx="256" cy="250" r="14" fill="#FF5F56"/>
  <circle cx="300" cy="250" r="14" fill="#FFBD2E"/>
  <circle cx="344" cy="250" r="14" fill="#27C93F"/>

  <!-- Big W letter -->
  <text x="512" y="560"
        font-family="SF Pro Display, -apple-system, Helvetica Neue, Arial, sans-serif"
        font-size="320"
        font-weight="700"
        fill="url(#whiteGradient)"
        text-anchor="middle"
        dominant-baseline="middle">W</text>

  <!-- Subtle highlight -->
  <rect x="64" y="64" width="896" height="896" rx="180" ry="180"
        fill="url(#whiteGradient)" opacity="0.05"/>
</svg>
